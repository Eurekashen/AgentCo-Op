[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agentcoop"
version = "0.3.0.dev0"
description = "AgentCo-Op v3: optimizing scientific agent collaboration without reference answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentCo-Op authors" }]
dependencies = [
  "httpx>=0.27",
  "numpy",
  "scipy",
  "pandas",
  "anndata",
  "scanpy",
  "pydeseq2",
  "requests",
  "requests-cache",
  "tiktoken",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["agentcoop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
